<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1310">
<meta name="color-scheme" content="dark light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Triple Yahoo!">
<title>Triple Yahoo!</title>
<script>try{const p=JSON.parse(localStorage.getItem('ty-prefs-v1'));if(p&&p.theme==='light')document.documentElement.dataset.theme='light';}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,800;1,9..144,800&family=Manrope:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="brand" href="./" aria-label="Triple Yahoo! home">
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect x="3" y="3" width="34" height="34" rx="9"/><circle cx="13" cy="13" r="3.2"/><circle cx="20" cy="20" r="3.2"/><circle cx="27" cy="27" r="3.2"/></svg>
      <span class="word">Triple <em>Yahoo!</em></span>
    </a>
    <div class="round" id="roundbar" role="progressbar" aria-label="Game progress" aria-valuemin="0" aria-valuemax="39" aria-valuenow="1">
      <span class="rtxt" aria-hidden="true"><small>Round</small><b class="rn" id="round">1</b><span class="of">/ 39</span></span>
      <span class="rfill" aria-hidden="true"><span class="rtxt"><small>Round</small><b class="rn">1</b><span class="of">/ 39</span></span></span>
    </div>
    <nav aria-label="Game menu">
      <button id="rules" class="icon" type="button" aria-label="How to play" title="How to play"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.6"/><circle cx="12" cy="16.8" r=".6" class="fill"/></svg></button>
      <button id="leaders" class="icon" type="button" aria-label="High scores" title="High scores"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8.5 20h7M10 17h4"/></svg></button>
      <button id="settingsBtn" class="icon" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
      <button id="theme" class="icon" type="button" aria-label="Switch theme" title="Switch theme"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></button>
      <button id="fs" class="icon fs" type="button" aria-label="Enter full screen" title="Full screen (F)" hidden><svg class="go-fs" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><svg class="leave-fs" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg><span class="fs-lbl">Exit full screen</span></button>
      <button id="new" class="btn ghost" type="button">New<span class="long"> game</span></button>
    </nav>
  </header>

  <main class="layout">
    <section class="tabletop" aria-label="Dice table">
      <div id="players" class="players"></div>
      <div class="status">
        <h2 id="instruction">Start with a little luck.</h2>
        <p id="help">Roll all five dice to begin your turn.</p>
      </div>
      <div id="stage" class="stage"><div id="burst" class="burst" aria-hidden="true">Yahoo!</div></div>
      <div class="controls">
        <div class="rollmeter" aria-hidden="true"><span></span><span></span><span></span></div>
        <button id="roll" class="roll" type="button">Roll the dice</button>
      </div>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
    </section>

    <section class="card" aria-label="Scorecard">
      <div class="cardhead">
        <div class="who"><small id="cardlabel">Scorecard</small><h2 id="cardname">Player 1</h2></div>
        <div class="grand"><small>Grand total</small><span class="gnum"><strong id="total" data-bump>0</strong></span></div>
      </div>
      <div class="sheetwrap"><div id="sheet" class="sheet" role="table" aria-label="Scorecard"></div></div>
    </section>
  </main>
</div>

<dialog id="dialog"><button class="close" type="button" aria-label="Close dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div id="dialogbody"></div></dialog>
<script type="module" src="app.mjs"></script>
</body>
</html>
